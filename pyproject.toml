[project]
name = "kypp"
version = "0.1.0"
description = "Swarm memory engine for coding agents — observe / distill / recall / consolidate over a shared store."
requires-python = ">=3.10"
dependencies = [
    "pyturso>=0.8.1",  # embedded tursodb: concurrent writes + native vector search
    "mcp",      # the MCP SDK (only the `serve` command needs it; imported lazily)
]

[project.optional-dependencies]
speccheck = ["tree-sitter>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24"]
# System One write gate (optional): any TypeSafe-API endpoint, e.g. Jev via OpenRouter.
s1 = ["typesafe-sdk>=0.7"]

[project.scripts]
kypp = "kypp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
