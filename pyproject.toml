[project]
name = "kypp"
version = "0.1.0"
description = "Swarm memory engine for coding agents — observe / distill / recall / consolidate over a shared store."
requires-python = ">=3.10"
dependencies = [
    "pyturso>=0.8.3",  # existing MVCC files: concurrent writes + vector_distance_cos. No FTS5 in MVCC mode.
    "libsql>=0.1.11",  # local quality store: FTS5 bm25 + exact cosine in one file. Latest release as of 2026-10-14.
    "mcp>=1.30,<2",  # FastMCP-based server; migrate to SDK v2 separately.
    "jsonschema>=4.18,<5",  # contract tests validate the cooperation input schemas
]

[project.optional-dependencies]
# System One write gate (optional): any TypeSafe-API endpoint, e.g. Jev via OpenRouter.
s1 = ["typesafe-sdk>=0.7"]

[project.scripts]
kypp = "kypp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kypp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
