name: spec-consistency
on:
  pull_request:
    paths:
      - "speccheck/**"
      - "kypp/**"
      - "tests/**"
      - "worker/src/**"
      - "worker/test/**"
      - "worker/migrations/**"
      - ".brief/**"
      - ".github/workflows/spec-consistency.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
concurrency:
  group: spec-consistency-${{ github.ref }}
  cancel-in-progress: true
jobs:
  advisory:
    runs-on: ${{ vars.RUNNER_LABEL == 'netcup' && fromJSON('["self-hosted","netcup"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: project lockfile matches the declared dependencies
        run: uv lock --check
      - name: install the package as declared
        run: |
          # One clean install uses only the wheel's declared dependencies. build_mcp()
          # imports FastMCP lazily, so constructing the server is the compatibility check.
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir /tmp/kypp-dist
          python -m venv /tmp/kypp-clean
          /tmp/kypp-clean/bin/pip install --upgrade pip
          /tmp/kypp-clean/bin/pip install /tmp/kypp-dist/*.whl
          # -I ignores PYTHONPATH and the user site, so the import has to come from
          # the wheel installed in this venv. The printed __file__ is that proof.
          /tmp/kypp-clean/bin/python -I - <<'PY'
          import tempfile
          from pathlib import Path
          import kypp
          import kypp.mcp_server as mcp_server
          from kypp.mcp_server import build_mcp
          from kypp.store import MemoryStore
          installed = "/tmp/kypp-clean/"
          for label, location in (("kypp", kypp.__file__), ("mcp_server", mcp_server.__file__)):
              print(label, location)
              if not location.startswith(installed):
                  raise SystemExit(f"{label} was not imported from the installed wheel: {location}")
          path = Path(tempfile.mkdtemp()) / "smoke.db"
          server = build_mcp(MemoryStore(str(path)), "pillbox")
          if server is None:
              raise SystemExit("build_mcp() did not construct a server")
          print("constructed", type(server).__name__)
          PY
          python -m pip install ".[speccheck]"
          # The mcp_server self-test grounds a temp file with ripgrep. ubuntu-24.04
          # runner images do not ship rg, so grounding comes back empty without it.
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: record runtime versions
        run: |
          python -c "import sys, importlib.metadata as m; print('python', sys.version); print('mcp', m.version('mcp')); print('pyturso', m.version('pyturso')); print('tree-sitter', m.version('tree-sitter'))"
          rg --version | head -n 1
      - name: checker tests and benchmark
        run: |
          python -m unittest discover -s speccheck/tests -v
          python -m speccheck bench
      - name: contract tests
        run: |
          python -m unittest discover -s tests -v
          python -m kypp.verify
          python -m kypp.mcp_server
      - name: spec consistency (advisory)
        if: always()
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
          else
            git fetch origin main --depth=1
            base="origin/main"
          fi
          python -m speccheck check --repo . --baseline "$base" --out spec-consistency-report.md --json spec-consistency-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-consistency-report
          path: |
            spec-consistency-report.md
            spec-consistency-report.json
