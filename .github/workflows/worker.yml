name: worker
on:
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # stdlib-only cross-language command oracle
      - run: npm ci
      - name: record runtime versions
        run: node -p "'node ' + process.version"
      - run: npm run typecheck
      - run: npm test
      - name: end-to-end smoke against wrangler dev
        run: |
          cp smoke.dev.vars .dev.vars
          npx wrangler d1 migrations apply kypp --local
          npx wrangler d1 execute kypp --local --command "INSERT OR IGNORE INTO projects(name, created_at) VALUES ('smoke', datetime('now'))"
          npm run dev:local -- --test-scheduled --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/ >/dev/null && break; sleep 1; done
          node test/smoke.mjs || { cat /tmp/wrangler.log; exit 1; }
  # Deploys main to the owner's install. Off unless the KYPP_D1_DATABASE_ID repository variable is set,
  # so forks and Deploy-to-Cloudflare copies never run it. The ids and domain stay out of wrangler.jsonc
  # (it is the template the button copies) and are spliced into wrangler.prod.jsonc here, the way
  # dev:local builds wrangler.local.jsonc. keep_vars leaves dashboard vars (KYPP_PUBLIC_URL,
  # KYPP_ROOM_ISSUERS, ...) in place. GitHub-hosted: this job holds the Cloudflare token.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KYPP_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-kypp
      cancel-in-progress: false
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.KYPP_D1_DATABASE_ID }}
      KV_ID: ${{ vars.KYPP_KV_ID }}
      DOMAIN: ${{ vars.KYPP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21"
      - run: npm ci
      - name: build wrangler.prod.jsonc
        run: |
          [[ "$D1_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "KYPP_D1_DATABASE_ID is not a D1 id"; exit 1; }
          [[ "$KV_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "KYPP_KV_ID is not a KV namespace id"; exit 1; }
          [[ "$DOMAIN" =~ ^[a-z0-9.-]+$ ]] || { echo "KYPP_DOMAIN is not a hostname"; exit 1; }
          sed -E \
            -e "s/(\"database_name\": \"kypp\",)/\1 \"database_id\": \"$D1_ID\",/" \
            -e "s/\{ \"binding\": \"OAUTH_KV\" \}/{ \"binding\": \"OAUTH_KV\", \"id\": \"$KV_ID\" }/" \
            -e "s/^(  \"ai\": \{ \"binding\": \"AI\" \},)$/  \"routes\": [{ \"pattern\": \"$DOMAIN\", \"custom_domain\": true }],\n  \"workers_dev\": false,\n  \"preview_urls\": false,\n\1/" \
            wrangler.jsonc > wrangler.prod.jsonc
          # Fail loud if wrangler.jsonc changed shape and a substitution silently missed.
          for want in "\"database_id\": \"$D1_ID\"" "\"id\": \"$KV_ID\"" "\"pattern\": \"$DOMAIN\"" '"workers_dev": false' '"preview_urls": false'; do
            grep -qF "$want" wrangler.prod.jsonc || { echo "wrangler.prod.jsonc is missing: $want"; exit 1; }
          done
      - run: npx wrangler d1 migrations apply DB --remote -c wrangler.prod.jsonc
      - name: deploy
        run: |
          npx wrangler deploy -c wrangler.prod.jsonc | tee /tmp/deploy.log
          grep -qF "env.OAUTH_KV ($KV_ID)" /tmp/deploy.log || { echo "deploy did not bind OAUTH_KV to $KV_ID"; exit 1; }
          grep -qF "$DOMAIN (custom domain)" /tmp/deploy.log || { echo "deploy did not attach $DOMAIN"; exit 1; }
