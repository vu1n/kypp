name: worker
on:
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: end-to-end smoke against wrangler dev
        run: |
          cp .dev.vars.example .dev.vars
          npx wrangler d1 migrations apply kypp --local
          npx wrangler dev --test-scheduled --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/ >/dev/null && break; sleep 1; done
          node test/smoke.mjs || { cat /tmp/wrangler.log; exit 1; }
