name: release
# A v* tag is the release: once both test suites pass on the tagged commit, `release` moves to it,
# and Workers Builds deploys kypp.vu1n.dev from `release`, never from main.
on:
  push:
    tags: ["v*"]
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  python:
    uses: ./.github/workflows/python.yml
  worker:
    uses: ./.github/workflows/worker.yml
  promote:
    needs: [python, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fast-forward only: an older tag can't roll production back. Roll back by tagging a revert.
      - name: move release to the tag
        run: git push origin "$GITHUB_SHA:refs/heads/release"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
